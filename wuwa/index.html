<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wuthering Waves - Official Clone</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="viewport-manager">
   <div class="bg-video-layer">
     <video autoplay loop muted playsinline class="cinematic-loop">
       <source src="assets/bg2-video.mp4" type="video/mp4">
     </video>
   </div>
    <div class ="ui-overlay-layer">
      <nav class ="top-navigation-bar">
      <div class ="nav-brand-logo">
        <img src="assets/nav-logo.png" alt="Wuthering Waves Logo" class ="brand-img">
    </div>
        <div class ="nav-link-container">
          <a href="#" class="nav-link active">HOME</a>
          <a href="#" class="nav-link">NEWS</a>
          <a href="#" class="nav-link">RESONATORS</a>
        </div>
      </nav>
      <footer class ="branding-footer"">
      <div class ="title-animation-box">
        <img src="assets/main-title.png" alt="Wuthering Waves" class="main-logo-graphic">
        <p class="subtitle-text">THE FINALE OF CHAPTER XUANFANG UNVEILED ON SEPTEMBER 30TH</p>
      </div>
        <div class ="download-matrix-grid">
        <div class ="qr-code-holder">
          <img src ="assets/qr-code.png" alt="Scan to Download" class="qr-img">
        </div>
        <div class="store-badges-container">
            <a href="#" class="badge-link"><img src="assets/badge-windows.png" alt="Windows PC"></a>
            <a href="#" class="badge-link"><img src="assets/badge-appstore.png" alt="App Store"></a>
            <a href="#" class="badge-link"><img src="assets/badge-googleplay.png" alt="Google Play"></a>
            <a href="#" class="badge-link"><img src="assets/badge-epic.png" alt="Epic Games"></a>
            <a href="#" class="badge-link"><img src="assets/badge-ps5.png" alt="PlayStation 5"></a>
        </div>
        </div>
      </footer>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
